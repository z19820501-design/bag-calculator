<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a7a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>HD / PE 計算器</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei",sans-serif;
  background:#f3f4f7;
  color:#111;
  min-height:100dvh;
  overflow-x:hidden;
}
.wrap{
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:
    max(14px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(24px, env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));
}
h1{
  margin:4px 0 14px;
  font-size:clamp(22px,6vw,28px);
  line-height:1.2;
}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.tab{
  width:100%;
  min-height:48px;
  padding:10px 8px;
  border:0;
  border-radius:12px;
  font-size:clamp(17px,4.8vw,20px);
  font-weight:700;
}
.active{background:#101a7a;color:#fff}
.card{
  margin-top:12px;
  background:#fff;
  padding:clamp(12px,4vw,18px);
  border-radius:16px;
}
.row{
  display:grid;
  grid-template-columns:minmax(78px,30%) minmax(0,1fr) 40px;
  gap:8px;
  align-items:center;
  margin:10px 0;
}
label{
  font-size:clamp(16px,4.3vw,19px);
  font-weight:600;
  white-space:nowrap;
}
input{
  min-width:0;
  width:100%;
  font-size:clamp(19px,5.2vw,23px);
  padding:10px 9px;
  text-align:right;
  border:1px solid #bbb;
  border-radius:9px;
  background:#fff;
}
.row>b{
  font-size:clamp(14px,3.8vw,17px);
}
.r{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto 28px;
  gap:8px;
  align-items:baseline;
  padding:10px 2px;
  border-bottom:1px solid #eee;
}
.r>span:first-child{
  font-size:clamp(15px,4vw,18px);
}
.v{
  font-size:clamp(20px,5.5vw,25px);
  font-weight:800;
  color:#101a7a;
  text-align:right;
}
.note{
  font-size:clamp(12px,3.5vw,14px);
  color:#666;
  margin-top:14px;
  line-height:1.5;
}
@media (max-width:360px){
  .wrap{padding-left:8px;padding-right:8px}
  .card{padding:10px}
  .row{grid-template-columns:72px minmax(0,1fr) 34px;gap:6px}
  .r{grid-template-columns:minmax(0,1fr) auto 24px;gap:6px}
}
@media (min-width:700px){
  .wrap{padding-top:24px}
  .card{padding:20px}
}
.tabs.three{grid-template-columns:1fr 1fr 1fr}.tabs.three .tab{font-size:clamp(15px,4vw,19px)}
</style></head>
<body><div class="wrap"><h1>HD / PE 塑膠袋計算器</h1><div class="tabs three"><button id="h" class="tab active" onclick="setT('HD')">HD</button><button id="p" class="tab" onclick="setT('PE')">PE</button><button id="s" class="tab" onclick="setT('SWEET')">地瓜袋</button></div><div id="normalCard" class="card">
<div class="row"><label>寬度</label><input id="w" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off"><b>cm</b></div><div class="row"><label>長度</label><input id="l" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off"><b>cm</b></div><div class="row"><label>厚度</label><input id="t" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off"><b>mm</b></div><div class="row"><label>預設重量</label><input id="kg" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off"><b>kg</b></div>
<div class="r"><span>每只重量</span><span id="piece" class="v">—</span><b>g</b></div><div class="r"><span>1公斤總只數</span><span id="count" class="v">—</span><b>只</b></div><div class="r"><span>預設重量總轉數</span><span id="turns" class="v">—</span><b>M</b></div>
<div class="note">轉數公式：243 ÷ 寬度 ÷ 厚度 ÷ 係數 × 1.03。HD係數0.19；PE係數0.184。</div></div><div id="sweetCard" class="card" style="display:none">
<div class="row"><label>實際轉數</label><input id="a1" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off"><b>M</b></div>
<div class="row"><label>實際重量</label><input id="a2" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off"><b>kg</b></div>
<div class="r"><span>誤差值</span><span id="errorValue" class="v">—</span><b>%</b></div>
<div class="r"><span>標準值</span><span class="v">-3</span><b>%</b></div>
</div></div>
<script>let typ="HD";const q=x=>document.getElementById(x);function setT(x){typ=x;q("h").classList.toggle("active",x==="HD");q("p").classList.toggle("active",x==="PE");q("s").classList.toggle("active",x==="SWEET");q("normalCard").style.display=x==="SWEET"?"none":"block";q("sweetCard").style.display=x==="SWEET"?"block":"none";if(x==="HD"){q("w").value=90;q("l").value=76;q("t").value=.025;q("kg").value=100;calc();}else if(x==="PE"){q("w").value=29;q("l").value=29;q("t").value=.05;q("kg").value=100;calc();}else{q("a1").value=2400;q("a2").value=115.4;calcSweet();}}function calc(){let w=+q("w").value,l=+q("l").value,t=+q("t").value,kg=+q("kg").value,k=typ==="HD"?.19:.184;if(!(w>0&&l>0&&t>0)){return}let piece=w*l*t*k,base=243/w/t/k*1.03,turns=base*kg/24.3;q("piece").textContent=piece.toFixed(4).replace(/0+$/,"").replace(/\.$/,"");q("count").textContent=Math.floor(1000/piece);q("turns").textContent=Math.floor(turns)}["w","l","t","kg"].forEach(x=>{
  const el=q(x);
  el.addEventListener("input",calc);
  el.addEventListener("focus",()=>setTimeout(()=>el.select(),0));
});
const order=["w","l","t","kg"];
order.forEach((id,i)=>{
  q(id).addEventListener("keydown",e=>{
    if(e.key==="Enter" || e.key==="ArrowDown"){
      e.preventDefault();
      if(i<order.length-1){
        q(order[i+1]).focus();
      }else if(e.key==="Enter"){
        q(id).blur();
      }
    }else if(e.key==="ArrowUp"){
      e.preventDefault();
      if(i>0){
        q(order[i-1]).focus();
      }
    }
  });
});function calcSweet(){const a1=parseFloat(q("a1").value),a2=parseFloat(q("a2").value);if(!(a1>0)||!Number.isFinite(a2)){q("errorValue").textContent="—";return;}const g1=a1/2058*100;const error=(a2-2.1-g1)/g1*100;q("errorValue").textContent=error.toFixed(2);}
["a1","a2"].forEach(id=>{const el=q(id);el.addEventListener("input",calcSweet);el.addEventListener("focus",()=>setTimeout(()=>el.select(),0));});
q("a1").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key==="ArrowDown"){e.preventDefault();q("a2").focus();}});
q("a2").addEventListener("keydown",e=>{if(e.key==="ArrowUp"){e.preventDefault();q("a1").focus();}else if(e.key==="Enter"){e.preventDefault();q("a2").blur();}});
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));setT("HD");</script></body></html>
